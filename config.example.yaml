# Android Studio Emulator
# name: "Pixel 5 API 34"
# device_type: "emulator"
# ip_address: "localhost"
# adb_port: 5555

# Waydroid (Android in Linux container)
# name: "Waydroid"
# device_type: "emulator"
# ip_address: "localhost"
# adb_port: 5555

# =============================================================================
# SETUP INSTRUCTIONS
# =============================================================================

# 1. Copy this file:
#    cp config.example.yaml ~/.hermes-phone-agent/config.yaml

# 2. Edit the config file with your device details

# 3. Test the connection:
#    python3 scripts/test_device.py

# 4. For Termux devices, ensure SSH is running on phone:
#    $PREFIX/bin/sshd

# 5. For ADB devices, connect first:
#    adb connect <IP>:5555

# =============================================================================